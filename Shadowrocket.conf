IP-CIDR,208.54.0.0/16,🇺🇸 美国节点,no-resolve

RULE-SET,https://raw.githubusercontent.com/zhanglei0823/shadowrocket-config/main/rules/BlockHttpDNS.list,🧱 DNS 防泄露
